services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    container_name: fastapi-app
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: fast_api_project
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
      